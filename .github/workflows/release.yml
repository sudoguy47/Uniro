name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g. v1.0.5)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK & Accept Licenses
        run: |
          export ANDROID_HOME="/usr/local/lib/android/sdk"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" || true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Accept Flutter Android Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Prepare Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not configured in GitHub Repository Secrets!"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | sed -e 's/-----BEGIN.*-----//g' -e 's/-----END.*-----//g' | tr -d '\r\n ' | base64 --decode > android/uniro-release.jks
          if [ ! -s android/uniro-release.jks ]; then
            echo "::error::android/uniro-release.jks is empty or decoding failed!"
            exit 1
          fi
          printf "storeFile=../uniro-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties

      - name: Compute Version Name and Version Code
        id: version_info
        run: |
          RAW_TAG="${{ github.event.inputs.tag_name }}"
          if [ -z "$RAW_TAG" ]; then
            RAW_TAG="${GITHUB_REF_NAME}"
          fi
          VERSION_NAME=$(echo "$RAW_TAG" | sed -e 's/^[vV]//')
          # Build number increments with each run, guaranteed > 2008
          BUILD_NUMBER=$((2008 + GITHUB_RUN_NUMBER))
          
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "tag=$RAW_TAG" >> $GITHUB_OUTPUT
          echo "Releasing version: $VERSION_NAME+$BUILD_NUMBER (tag: $RAW_TAG)"

      - name: Install dependencies
        run: flutter pub get

      - name: Build Split APKs
        run: |
          flutter build apk --release --split-per-abi \
            --android-skip-build-dependency-validation \
            --build-name="${{ steps.version_info.outputs.version_name }}" \
            --build-number=${{ steps.version_info.outputs.build_number }}
          
          cd build/app/outputs/flutter-apk
          for f in app-*-release.apk; do
            if [ -f "$f" ]; then
              sha256sum "$f" > "${f}.sha256"
            fi
          done
          sha256sum app-*-release.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Split APKs to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_info.outputs.tag }}
          name: "Uniro ${{ steps.version_info.outputs.tag }}"
          body: |
            What's New:
            • ✨ Interactive App Guide & Feature Tour
            • 🎯 Step-by-step Demo for Tasks & Class Routine
            • 🎨 Clean Borderless Avatar & Typography Polish
            • 🏷️ Course Code Support in Class Routine
            • ⚡ Performance Improvements & Faster Engine
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk.sha256
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
            build/app/outputs/flutter-apk/SHA256SUMS.txt
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
