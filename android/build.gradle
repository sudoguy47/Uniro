
allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
// Some older plugins (e.g. file_picker 8.x) still declare compileSdk 34,
// while flutter_plugin_android_lifecycle (a transitive dependency of newer
// image_picker plugin modules) requires android-36. Force every plugin
// module onto the app's compileSdk instead of letting the build fail.
// minSdk is intentionally left alone.
subprojects {
    afterEvaluate { subproject ->
        if (subproject.hasProperty('android')) {
            subproject.android {
                compileSdk 36
            }
        }
    }
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
