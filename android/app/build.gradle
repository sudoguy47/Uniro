plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// Release signing: reads android/key.properties (see KEYSTORE.md).
// Absent file (fresh clone, CI without secrets) → release falls back to
// the debug key so anyone can still build; NEVER commit key.properties.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    // Fail fast with a clear message instead of AGP's cryptic signing
    // error: every field must be present and the keystore file must exist.
    // Only the storeFile *path* is echoed here — never passwords.
    def missingKey = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
        .find { k -> keystoreProperties[k] == null || !keystoreProperties[k].trim() }
    if (missingKey != null) {
        throw new GradleException(
            "android/key.properties is missing '${missingKey}'. " +
            "See android/KEYSTORE.md — and never commit this file.")
    }
    def configuredStore = file(keystoreProperties['storeFile'])
    if (!configuredStore.isFile()) {
        throw new GradleException(
            "Release keystore not found at '${keystoreProperties['storeFile']}' " +
            "(from android/key.properties). Place your .jks there or fix " +
            "storeFile. See android/KEYSTORE.md.")
    }
}

android {
    namespace "dev.sudoguy.uniro"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true    // ← নতুন
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId "dev.sudoguy.uniro"
        minSdk flutter.minSdkVersion
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName

        // NOTE: no ndk abiFilters here on purpose — per-ABI filtering is done
        // by the splits block below. An abiFilters entry would strip .so
        // files out of the OTHER splits too, producing broken APKs.
        // Only English resources — strips translated strings/drawables that
        // every plugin bundles for locales the app never uses.
        // Audited 2026-10: the app hardcodes all UI strings in English,
        // declares no localizationsDelegates/supportedLocales, and uses
        // intl for DateFormat only (default 'en' locale, never awaited).
        // So keeping this LOSES nothing and saves APK size. Do not remove
        // unless real multi-locale support lands.
        resConfigs 'en'
    }

    // NOTE: no `splits { abi { ... } }` block on purpose — ABI splits are
    // incompatible with shrinkResources when building an App Bundle
    // ("Multiple shrunk-resources files" failure). Play gets per-device
    // size savings from the `bundle` splits below instead, and sideloaders
    // use the per-ABI APKs Flutter already emits (app-arm64-v8a-release.apk).
    bundle {
        abi {
            enableSplit = true
        }
        density {
            enableSplit = true
        }
        language {
            enableSplit = true
        }
    }

    packaging {
        resources {
            excludes += 'META-INF/DEPENDENCIES'
            excludes += 'META-INF/LICENSE'
            excludes += 'META-INF/LICENSE.txt'
            excludes += 'META-INF/NOTICE'
            excludes += 'META-INF/NOTICE.txt'
            excludes += 'META-INF/*.kotlin_module'
            excludes += 'DebugProbesKt.bin'
        }
    }

    signingConfigs {
        // Populated from android/key.properties only when the file exists
        // (see KEYSTORE.md). Contributors without the file simply never
        // reference this config (see buildTypes below).
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile = file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // Signed with the release key when android/key.properties exists,
            // otherwise with the debug key (local/dev builds only — never
            // ship a debug-signed APK to testers or GitHub Releases, and
            // never change keys between updates: same key or users cannot
            // update, including via the in-app OTA flow).
            signingConfig keystorePropertiesFile.exists()
                ? signingConfigs.release
                : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.2'
}

flutter {
    source "../.."
}