pluginManagement {
    try {
        def pe = Class.forName("java.lang.ProcessEnvironment")
        def envField = pe.getDeclaredField("theEnvironment")
        envField.setAccessible(true)
        def envMap = envField.get(null)
        envMap.keySet().removeIf { it.toString() == "ANDROID_PREFS_ROOT" }

        def unmodField = pe.getDeclaredField("theCaseInsensitiveEnvironment")
        unmodField.setAccessible(true)
        def unmodMap = unmodField.get(null)
        unmodMap.keySet().removeIf { it.toString() == "ANDROID_PREFS_ROOT" }
    } catch (ignored) {}

    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null : "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "9.0.1" apply false
    id "org.jetbrains.kotlin.android" version "2.2.20" apply false
}

include ":app"
